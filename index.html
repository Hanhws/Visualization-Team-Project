<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NERFLE · 한국에서 못 보는 넷플릭스</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root { --nf-red:#E50914; --bg:#000; --land:#3a3a3a; --land-lit:#555; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  body { overflow:hidden; }
  .view { position:fixed; inset:0; display:none; }
  .view.active { display:block; }

  /* ---------- 첫 화면 (좌:지도 / 우:지구본) ---------- */
  #landing { display:flex; }
  #landing.active { display:flex; }
  .half { position:relative; flex:1; height:100%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; transition:flex .5s ease; }
  .half::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.35);
    transition:background .4s; }
  .half:hover::after { background:rgba(0,0,0,.05); }
  .half:hover { flex:1.25; }
  .half .divider { position:absolute; right:0; top:0; bottom:0; width:1px;
    background:rgba(255,255,255,.12); }
  .half svg { width:100%; height:100%; display:block; }
  .half .caption { position:absolute; z-index:3; text-align:center;
    pointer-events:none; padding:0 24px; }
  .half .caption h2 { font-size:clamp(22px,3vw,40px); font-weight:800; letter-spacing:-.5px; }
  .half .caption p  { margin-top:10px; color:#cfcfcf; font-size:clamp(13px,1.2vw,17px); }
  .half .caption .go { margin-top:18px; display:inline-block; font-size:13px;
    color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:999px;
    padding:8px 18px; transition:.25s; }
  .half:hover .caption .go { background:var(--nf-red); border-color:var(--nf-red); }

  .brand { position:absolute; top:26px; left:50%; transform:translateX(-50%);
    z-index:5; text-align:center; pointer-events:none; }
  .brand .logo { color:var(--nf-red); font-weight:900; letter-spacing:3px;
    font-size:clamp(20px,2.4vw,30px); }
  .brand .sub { color:#9a9a9a; font-size:12px; margin-top:4px; letter-spacing:.5px; }

  /* ---------- 공통 상단바 ---------- */
  .topbar { position:absolute; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:16px; padding:18px 26px;
    background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0)); }
  .back { cursor:pointer; color:#fff; font-size:14px; font-weight:600;
    border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:8px 16px;
    background:rgba(0,0,0,.3); transition:.2s; }
  .back:hover { background:var(--nf-red); border-color:var(--nf-red); }
  .topbar .title { font-weight:800; font-size:18px; }
  .topbar .title b { color:var(--nf-red); }

  /* ---------- 지도 화면 ---------- */
  #mapView svg { width:100%; height:100%; background:var(--bg); }
  .country { fill:var(--land); stroke:#000; stroke-width:.4px; }
  /* 클릭 가능한 나라: 평소엔 회색, 마우스 올릴 때만 빨강+확대 */
  .country.clickable { fill:var(--land); cursor:pointer;
    transition:fill .2s, transform .2s; transform-box:fill-box; transform-origin:center; }
  .country.clickable:hover,
  .country.clickable.hot { fill:var(--nf-red); transform:scale(1.09);
    filter:drop-shadow(0 0 6px rgba(229,9,20,.8)); }
  /* 첫 화면 미니맵 대상 국가: 고정 붉은색(깜빡임 없음) */
  #miniMap .target { fill:#a3242c; }
  .maphint { position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:5; color:#bbb; font-size:14px; background:rgba(0,0,0,.5);
    padding:10px 18px; border-radius:999px; }
  .maphint b { color:var(--nf-red); }
  #tooltip { position:fixed; z-index:50; pointer-events:none; opacity:0;
    background:var(--nf-red); color:#fff; font-weight:700; font-size:14px;
    padding:7px 12px; border-radius:8px; transform:translate(-50%,-140%);
    white-space:nowrap; transition:opacity .12s; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  #tooltip small { display:block; font-weight:500; opacity:.9; font-size:11px; }

  /* ---------- 포스터 그리드 (나라별 / 검색) ---------- */
  .scroll { position:absolute; inset:0; overflow-y:auto; padding:96px 40px 60px; }
  .headline { margin-bottom:8px; font-size:clamp(24px,3vw,38px); font-weight:800; }
  .headline b { color:var(--nf-red); }
  .subline { color:#9a9a9a; margin-bottom:28px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:22px 18px; }
  @media (max-width:1100px){ .grid{ grid-template-columns:repeat(4,1fr);} }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr);} .scroll{padding:90px 20px 50px;} }
  .card { cursor:default; }
  .poster { position:relative; width:100%; aspect-ratio:2/3; border-radius:8px;
    overflow:hidden; background:#161616; box-shadow:0 6px 18px rgba(0,0,0,.5);
    transition:transform .2s; }
  .card:hover .poster { transform:scale(1.05); }
  .poster img { width:100%; height:100%; object-fit:cover; display:block; }
  .poster .noimg { display:flex; align-items:center; justify-content:center;
    height:100%; color:#666; font-size:12px; text-align:center; padding:10px; }
  .poster .badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7);
    color:#ffd54a; font-size:11px; font-weight:700; padding:3px 7px; border-radius:5px; }
  .poster .type { position:absolute; top:8px; right:8px; background:var(--nf-red);
    color:#fff; font-size:10px; font-weight:700; padding:3px 6px; border-radius:5px; }
  .cap { margin-top:9px; }
  .cap .t { font-size:14px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cap .m { margin-top:3px; color:#8a8a8a; font-size:12px; }

  /* ---------- 검색 화면 ---------- */
  #searchView { background:radial-gradient(1200px 600px at 50% -10%, #1a1a1a, #000 60%); }
  .searchWrap { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; padding-top:16vh; overflow-y:auto; }
  .searchWrap.searched { padding-top:96px; }
  .ask { font-size:clamp(24px,4vw,44px); font-weight:800; text-align:center;
    margin-bottom:26px; letter-spacing:-.5px; }
  .ask b { color:var(--nf-red); }
  .searchbox { width:min(680px,88vw); position:relative; }
  .searchbox input { width:100%; font-size:18px; padding:18px 54px 18px 22px;
    border-radius:14px; border:1px solid #333; background:#111; color:#fff;
    outline:none; transition:border .2s; }
  .searchbox input:focus { border-color:var(--nf-red); }
  .searchbox .ico { position:absolute; right:18px; top:50%; transform:translateY(-50%);
    color:#777; font-size:20px; }
  .results { width:min(1200px,92vw); margin-top:34px; }
  .empty { color:#888; text-align:center; margin-top:40px; font-size:15px; }
  .loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#888; z-index:100; }
</style>
</head>
<body>

<!-- ===================== 첫 화면 ===================== -->
<section id="landing" class="view active">
  <div class="brand"><div class="logo">NERFLE</div>
    <div class="sub">한국에서 볼 수 없는 넷플릭스</div></div>

  <div class="half" id="halfMap" onclick="openMap()">
    <svg id="miniMap"></svg><div class="divider"></div>
    <div class="caption">
      <h2>국가별로 둘러보기</h2>
      <p>한국엔 없는 작품이 있는 나라를 지도에서 선택하세요</p>
      <span class="go">지도 열기 →</span>
    </div>
  </div>

  <div class="half" id="halfGlobe" onclick="openSearch()">
    <svg id="miniGlobe"></svg>
    <div class="caption">
      <h2>작품으로 찾기</h2>
      <p>보고 싶은 프로그램을 검색해 보세요</p>
      <span class="go">검색 열기 →</span>
    </div>
  </div>
</section>

<!-- ===================== 지도 화면 ===================== -->
<section id="mapView" class="view">
  <div class="topbar">
    <span class="back" onclick="goHome()">← 처음으로</span>
    <span class="title"><b>한국 미제공</b> 작품이 있는 나라를 클릭하세요</span>
  </div>
  <svg id="bigMap"></svg>
  <div class="maphint">🔴 색이 있는 나라만 클릭 가능 · 마우스를 올리면 나라 이름이 보여요</div>
</section>

<!-- ===================== 나라별 작품 화면 ===================== -->
<section id="countryView" class="view">
  <div class="topbar"><span class="back" onclick="openMap()">← 지도로</span></div>
  <div class="scroll" id="cvScroll">
    <div class="headline" id="cvTitle"></div>
    <div class="subline" id="cvSub"></div>
    <div class="grid" id="cvGrid"></div>
  </div>
</section>

<!-- ===================== 검색 화면 ===================== -->
<section id="searchView" class="view">
  <div class="topbar"><span class="back" onclick="goHome()">← 처음으로</span></div>
  <div class="searchWrap" id="searchWrap">
    <div class="ask">어떤 프로그램을 <b>보고 싶으신가요?</b></div>
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="제목을 입력하세요 (예: 오징어, Friends, 나루토...)" autocomplete="off" />
      <span class="ico">🔍</span>
    </div>
    <div class="results"><div class="grid" id="srGrid"></div><div class="empty" id="srEmpty"></div></div>
  </div>
</section>

<div id="tooltip"></div>
<div class="loading" id="loading">세계지도 불러오는 중…</div>

<script src="data.js"></script>
<script>
const DATA = window.NERFLE;
const idToCode = {};                         // topojson 숫자id -> ISO2
Object.values(DATA.countries).forEach(c => { if(c.id) idToCode[c.id] = c.iso2; });

const $ = s => document.querySelector(s);
function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#'+id).classList.add('active'); }

function goHome(){ show('landing'); }
function openMap(){ show('mapView'); }
function openSearch(){ show('searchView'); setTimeout(()=>$('#searchInput').focus(),200); }

/* ---------------- 포스터 카드 ---------------- */
function card(p){
  const type = p.media_type==='movie' ? '영화' : 'TV';
  const rating = (p.vote!=null && p.vote>0) ? `<span class="badge">★ ${p.vote}</span>` : '';
  const img = p.poster
    ? `<img loading="lazy" src="${p.poster}" alt="${p.title}"
         onerror="this.parentNode.innerHTML='<div class=noimg>${p.title.replace(/'/g,'')}</div>'">`
    : `<div class="noimg">${p.title}</div>`;
  const meta = [p.year, p.country].filter(Boolean).join(' · ');
  return `<div class="card"><div class="poster">${rating}<span class="type">${type}</span>${img}</div>
    <div class="cap"><div class="t">${p.title}</div><div class="m">${meta}</div></div></div>`;
}

/* ---------------- 스크롤 시 조금씩 렌더 ---------------- */
function renderMore(grid, state, batch=48){
  const next = state.list.slice(state.shown, state.shown + batch);
  if(!next.length) return;
  grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
  state.shown += next.length;
}
function nearBottom(el){ return el.scrollTop + el.clientHeight > el.scrollHeight - 700; }

/* ---------------- 나라별 화면 ---------------- */
let cvState = {list:[], shown:0};
function openCountry(code){
  const c = DATA.countries[code]; if(!c) return;
  $('#cvTitle').innerHTML = `${c.name} <b>넷플릭스</b>`;
  $('#cvSub').textContent = `한국에서는 볼 수 없는 작품 ${c.count.toLocaleString()}편`;
  cvState = {list:c.programs, shown:0};
  $('#cvGrid').innerHTML = '';
  renderMore($('#cvGrid'), cvState, 60);
  show('countryView'); $('#cvScroll').scrollTop = 0;
}
$('#cvScroll').addEventListener('scroll', e => {
  if(nearBottom(e.target)) renderMore($('#cvGrid'), cvState);
});

/* ---------------- 검색 화면 ---------------- */
const sIn = $('#searchInput');
let srState = {list:[], shown:0};
sIn.addEventListener('input', () => {
  const q = sIn.value.trim().toLowerCase();
  const wrap = $('#searchWrap');
  if(!q){ $('#srGrid').innerHTML=''; $('#srEmpty').textContent=''; wrap.classList.remove('searched'); return; }
  wrap.classList.add('searched');
  const hits = DATA.all.filter(p =>
    (p.title||'').toLowerCase().includes(q) || (p.genres||'').toLowerCase().includes(q));
  srState = {list:hits, shown:0};
  $('#srGrid').innerHTML = '';
  renderMore($('#srGrid'), srState, 60);
  $('#srEmpty').textContent = hits.length ? '' : `'${sIn.value}' 에 대한 결과가 없어요.`;
});
$('#searchWrap').addEventListener('scroll', e => {
  if(nearBottom(e.target)) renderMore($('#srGrid'), srState);
});

/* ---------------- 지도 그리기 (D3) ---------------- */
function drawMap(svgSel, feats, {globe=false, interactive=false, spin=false}={}){
  const svg = d3.select(svgSel);
  const node = svg.node().getBoundingClientRect();
  const w = node.width || window.innerWidth, h = node.height || window.innerHeight;
  svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();

  const proj = (globe ? d3.geoOrthographic() : d3.geoNaturalEarth1())
    .fitExtent([[10,10],[w-10,h-10]], {type:'Sphere'});
  const path = d3.geoPath(proj);

  if(globe){
    svg.append('circle').attr('cx',w/2).attr('cy',h/2)
       .attr('r',proj.scale()).attr('fill','#0b1a2b')
       .attr('stroke','rgba(255,255,255,.15)');
  }
  const g = svg.append('g');
  const paths = g.selectAll('path').data(feats).join('path')
    .attr('d', path)
    .attr('class', d => {
      const on = interactive && idToCode[String(d.id)];
      return 'country' + (on ? ' clickable' : '');
    });

  if(interactive){
    const t = $('#tooltip');
    paths.filter(d=>idToCode[String(d.id)])
      .style('cursor','pointer')
      .on('mouseenter', function(ev,d){
        const el = d3.select(this);
        el.raise().classed('hot', true);           // 색·확대 (CSS .hot)
        const c = DATA.countries[idToCode[String(d.id)]];
        t.innerHTML = `${c.name}<small>한국 미제공 ${c.count}편 · 클릭</small>`;
        t.style.opacity = 1;
      })
      .on('mousemove', function(ev){
        t.style.left = ev.clientX+'px'; t.style.top = ev.clientY+'px';
      })
      .on('mouseleave', function(){
        d3.select(this).classed('hot', false);
        t.style.opacity = 0;
      })
      .on('click', function(ev,d){ openCountry(idToCode[String(d.id)]); });
  }

  if(globe){                                  // 지구본 천천히 회전
    d3.timer(el => {
      proj.rotate([el*0.02 - 60, -15]);
      g.selectAll('path').attr('d', path);
    });
  }
  if(spin){                                   // 평면 지도: 경도 회전으로 '지구가 흐르는' 느낌
    d3.timer(el => {
      proj.rotate([el*0.012, 0]);
      g.selectAll('path').attr('d', path);
    });
  }
  return {highlight:paths};
}

/* ---------------- 초기화 ---------------- */
let WORLD_FEATS = null, bigDrawn = false;

// 지도 화면은 열릴 때(실제 크기 확보 후) 그린다 → 인터랙션 정상 동작
const _openMap = openMap;
openMap = function(){
  show('mapView');
  if(WORLD_FEATS && !bigDrawn){ drawMap('#bigMap', WORLD_FEATS, {interactive:true}); bigDrawn = true; }
};

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(world => {
    WORLD_FEATS = topojson.feature(world, world.objects.countries).features;
    $('#loading').style.display = 'none';
    drawMap('#miniMap', WORLD_FEATS, {interactive:false, spin:true});
    drawMap('#miniGlobe', WORLD_FEATS, {globe:true});
    // 미니맵 대상 국가: 빨갛게 맥동(.target CSS 애니메이션)
    d3.select('#miniMap').selectAll('path')
      .filter(d=>idToCode[String(d.id)]).classed('target', true);
  })
  .catch(() => { $('#loading').textContent = '지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; });

window.addEventListener('resize', () => location.reload());
</script>
</body>
</html>
